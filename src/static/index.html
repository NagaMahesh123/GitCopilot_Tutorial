<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Registration</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Student Registration &amp; Activities</h2>
    </header>

    <main>
      <section id="students-container" class="wide-section">
        <h3>Student Records</h3>
        <p class="section-help">Create, view, edit, or delete student registrations.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Email</th><th>Grade</th><th>Actions</th></tr>
            </thead>
            <tbody id="students-list">
              <tr><td colspan="4">Loading students...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="student-form-container">
        <h3 id="student-form-title">Add a Student</h3>
        <form id="student-form">
          <input type="hidden" id="student-id" />
          <div class="form-group">
            <label for="student-name">Student name</label>
            <input id="student-name" name="name" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="student-email">Student email</label>
            <input id="student-email" name="email" type="email" required maxlength="254" />
          </div>
          <div class="form-group">
            <label for="student-grade">Grade</label>
            <input id="student-grade" name="grade" required maxlength="20" placeholder="e.g. 10" />
          </div>
          <button type="submit" id="save-student-button">Add Student</button>
          <button type="button" id="cancel-edit-button" class="secondary hidden">Cancel</button>
        </form>
        <div id="student-message" class="message hidden" role="status" aria-live="polite"></div>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list"><p>Loading activities...</p></div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity-email">Student email</label>
            <input type="email" id="activity-email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select activity</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="activity-message" class="message hidden" role="status" aria-live="polite"></div>
      </section>
    </main>

    <footer><p>&copy; 2026 Mergington High School</p></footer>
    <script src="app.js"></script>
  </body>
</html>
